<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Escala Operacional - ANS - LiderBpo | Versão 8.3</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#edf4f7;margin:0;color:#17324d}
header{background:#fff;border-bottom:4px solid #0c5f7b;padding:18px 28px}
header img{width:55px;vertical-align:middle;margin-right:15px}
h1{display:inline;color:#16385a;font-size:22px}
.container{max-width:1150px;margin:auto;padding:25px}
.card{background:#fff;border-radius:18px;padding:25px;margin-bottom:20px;box-shadow:0 4px 15px #ccd}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.box{background:#f4fafc;border:1px solid #d6e7ed;border-radius:14px;padding:18px}
.box b{font-size:22px;display:block;margin-top:8px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day{border:1px solid #d8e2e8;border-radius:12px;min-height:90px;padding:10px}
.tag{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;margin-top:10px}
.trabalho{background:#d8f5e5}.folga{background:#eef2f5}.feriado{background:#ffdede}.treino{background:#eadfff}.inicio{background:#fff1bf}
@media(max-width:700px){.grid,.calendar{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<img src="ans-logo.jpg"><h1>Escala Operacional - ANS - LiderBpo<br><small>Versão 8.3</small></h1>
</header>

<div class="container">
<div id="login" class="card">
<h2>Acesso do colaborador</h2>
<input id="user" placeholder="nome.sobrenome"><br><br>
<input id="pass" type="password" placeholder="Senha"><br><br>
<button onclick="entrar()">Entrar</button>
<p>Olá, que bom ter você aqui! Tenha um ótimo plantão.</p>
</div>

<div id="painel" style="display:none">

<div class="card">
<h2 id="nome"></h2>
<p id="dados"></p>
</div>

<div class="card">
<h2>Pausas programadas</h2>
<div class="grid">
<div class="box">☕ Pausa 1 - 10 minutos<b id="p1"></b></div>
<div class="box">🍽 Almoço - 1 hora<b id="al"></b></div>
<div class="box">☕ Pausa 2 - 10 minutos<b id="p2"></b></div>
</div>
</div>

<div class="card">
<h2>Escala mensal · Setembro/2026</h2>
<div class="calendar" id="cal"></div>
</div>

</div>
</div>

<script src="usuarios.js"></script>
<script>
function entrar(){
let u=user.value.toLowerCase(), p=pass.value;
let x=usuarios.find(a=>a.usuario==u && a.senha==p);
if(!x){alert("Usuário ou senha inválidos");return;}
login.style.display="none";painel.style.display="block";
nome.innerHTML=x.nome;
dados.innerHTML="Cargo: "+x.cargo+"<br>Supervisor: "+x.supervisor+"<br>Jornada: "+x.entrada+" às "+x.saida;
p1.innerHTML=x.pausa1;al.innerHTML=x.almoco;p2.innerHTML=x.pausa2;
let estados=["A iniciar","A iniciar","A iniciar","A iniciar","A iniciar","Folga","Feriado","Treinamento","Treinamento","Treinamento","Treinamento","Folga","Folga","Treinamento","Treinamento","Treinamento","Treinamento","Treinamento","Folga","Folga","Trabalho","Trabalho","Trabalho","Trabalho","Trabalho","Folga","Folga","Trabalho","Trabalho","Trabalho"];
estados.forEach((e,i)=>{
let c=e=="Trabalho"?"trabalho":e=="Folga"?"folga":e=="Feriado"?"feriado":e=="Treinamento"?"treino":"inicio";
cal.innerHTML+="<div class='day'><b>"+(i+1)+"</b><br><span class='tag "+c+"'>"+e+"</span></div>";
});
}
</script>

<style>
.header-actions{
position:absolute;right:30px;top:25px;
background:#0c5f7b;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px
}
.status-box{
background:#f4fafc;border-left:5px solid #0c5f7b;
padding:15px;border-radius:12px;margin-bottom:15px
}
.print-btn{
background:#16385a;margin-top:10px
}
</style>
<script>
function imprimirEscala(){
 window.print();
}
</script>

<button class="print-btn" onclick="imprimirEscala()">🖨 Imprimir minha escala</button>
</body>
</html>
