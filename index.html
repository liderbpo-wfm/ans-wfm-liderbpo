<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef5f8;color:#17324d}
header{background:#fff;padding:18px 30px;border-bottom:4px solid #0c7185;display:flex;align-items:center;gap:20px}
header img{height:65px}
.container{max-width:1100px;margin:30px auto;padding:20px}
.card{background:white;border-radius:16px;padding:25px;box-shadow:0 5px 18px #ccd;margin-bottom:20px}
button{background:#007c91;color:white;border:0;border-radius:10px;padding:14px 22px;font-weight:bold;cursor:pointer}
input,select{width:100%;padding:14px;border:1px solid #ccd;border-radius:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.item{background:#f7fbfc;border:1px solid #d9e7ea;padding:18px;border-radius:12px}
.title{font-size:22px;font-weight:bold}
.small{color:#607d8b}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>

<div class="container">
<div class="card" id="login">
<h2>Acesso</h2>
<p>Login único de consulta</p>
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<p id="msg"></p>

<div id="area" style="display:none">
<div class="card">
<h2>Minha escala</h2>
<select id="nome" onchange="mostrar()"></select>
</div>

<div class="card">
<div class="title" id="colab"></div>
<p id="jornada"></p>
<div class="grid">
<div class="item">☕ Pausa 1<br><b>10 minutos</b><br><span id="p1">09:00 - 09:10</span></div>
<div class="item">🍽 Almoço<br><b>1 hora</b><br><span id="almoco">12:00 - 13:00</span></div>
<div class="item">☕ Pausa 2<br><b>10 minutos</b><br><span id="p2">14:30 - 14:40</span></div>
</div>
</div>

<div class="card">
<h2>Escala mensal</h2>
<p>Regra operacional: 5x2 (segunda a sexta)</p>
<div id="escala"></div>
</div>
</div>
</div>

<script>
const usuarios=[ 
{nome:"ADRIANA DAS NEVES PEREIRA", entrada:"08:00", saida:"16:12"},
{nome:"OPERADOR TESTE", entrada:"08:00", saida:"16:12"}
];

function entrar(){
 if(document.getElementById('user').value=="ans" && document.getElementById('pass').value=="ANS@2026"){
 document.getElementById('login').style.display="none";
 document.getElementById('area').style.display="block";
 let s=document.getElementById('nome');
 usuarios.forEach(x=>{let o=document.createElement('option');o.text=x.nome;s.add(o)});
 mostrar();
 } else document.getElementById('msg').innerHTML="Acesso inválido";
}

function mostrar(){
 let n=document.getElementById('nome').value;
 let x=usuarios.find(a=>a.nome==n);
 document.getElementById('colab').innerHTML=x.nome;
 document.getElementById('jornada').innerHTML="Entrada: "+x.entrada+" | Saída: "+x.saida;
 document.getElementById('escala').innerHTML="Setembro/2026<br>🟢 Trabalho<br>⚪ Folgas semanais<br>🔴 Feriados";
}
</script>
