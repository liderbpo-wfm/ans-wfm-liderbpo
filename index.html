<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ANS WFM Individual</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#edf4f7;margin:0;color:#17324d}
header{background:#005b7f;color:white;padding:22px;font-size:24px;font-weight:bold}
.container{max-width:900px;margin:auto;padding:25px}
.card{background:white;padding:25px;border-radius:16px;margin-bottom:20px;box-shadow:0 4px 15px #ccd}
input,button{width:100%;padding:14px;margin-top:10px;border-radius:10px}
input{border:1px solid #ccc}button{background:#007c91;color:white;border:0;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.box{padding:20px;background:#f3fafc;border-radius:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>ANS WFM | Portal Individual de Escala</header>
<div class="container">
<div class="card" id="login">
<h2>Acesso do colaborador</h2>
<input id="user" placeholder="nome.sobrenome">
<input id="pass" type="password" placeholder="Senha">
<button onclick="entrar()">Entrar</button>
<p id="erro"></p>
</div>

<div id="painel" style="display:none">
<div class="card">
<h2 id="nome"></h2>
<p id="dados"></p>
</div>
<div class="card">
<h2>Minhas pausas</h2>
<div class="grid">
<div class="box">☕ Pausa 1<br><b id="p1"></b></div>
<div class="box">🍽 Almoço<br><b id="al"></b></div>
<div class="box">☕ Pausa 2<br><b id="p2"></b></div>
</div>
</div>
<div class="card">
<h2>Minha escala</h2>
<p>Consulta individual de setembro/2026.</p>
</div>
</div>
</div>
<script src="usuarios.js"></script>
<script>
function entrar(){
let u=document.getElementById('user').value.toLowerCase();
let p=document.getElementById('pass').value;
let x=usuarios.find(a=>a.usuario==u && a.senha==p);
if(x){
login.style.display='none';
painel.style.display='block';
nome.innerHTML=x.nome;
dados.innerHTML='Cargo: '+x.cargo+'<br>Supervisor: '+x.supervisor+'<br>Jornada: '+x.entrada+' às '+x.saida;
p1.innerHTML=x.pausa1;
al.innerHTML=x.almoco;
p2.innerHTML=x.pausa2;
}else erro.innerHTML='Usuário ou senha inválidos';
}
</script>
</body>
</html>
